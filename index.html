<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Read and Record BL">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>Read and Record BL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
  ============================================================
  书斋 · 需求清单（v0.11.0）
  ------------------------------------------------------------
  1. 书库：添加 / 删除 / 查询书籍；状态 5 种（底色区分）
     - 添加/编辑表单可选填「角色姓名」
     - 搜索支持书名 / 原名 / 作者 / 标签 / 地区 / 类型，200ms 防抖
     - 支持按评分排序（同分按书名），可取消；箭头用 SVG
  2. 书籍详情：基本信息、所属书单、打分、简评、角色姓名、摘录
     - 顶部状态按钮组，点击直接切换状态（即时保存，失败回滚）
  3. 标签：预置 + 新建/重命名/删除，点击进书库筛选，标签页支持搜索（防抖）
     - 书籍表单的标签区右侧「＋」按钮，不显示文字
  4. 摘录：独立摘录库，按时间倒序，支持关键词搜索（防抖）
     - 添加摘录时书籍改为搜索选择，点击搜索框显示最近摘录过的书（最多 5 条）
     - 摘录内容与感想可即时编辑；摘录库内单条限 5 行可展开
  5. 书单：自定义、手动排序；书单内添加书籍支持搜索（防抖）并即时刷新
  6. 首页：快捷入口、快捷添加书籍、状态统计、正在读、最新动态、最近摘录
     - 默认标题「Read and Record BL」，点击改名，写入用户元数据
  7. 设置：JSON 导出/导入、本地备份与恢复、清空数据、退出登录、需求清单
     - 新增「阅读统计」页面：今年读完、平均分、藏书总数、状态分布、按月阅读趋势
  8. 账户与云端：Supabase 邮箱登录 + 行级安全隔离
  9. 数据安全与性能：
     - 保存为增量同步（对比快照，仅同步变化的行）
     - 保存失败 Toast 提示 + 按钮恢复
     - 每次保存后自动本地快照（保留 3 份）
     - 导入/清空/恢复备份后自动全量同步一次
  ============================================================
-->
<style>
:root{
  --fg:#111;--sub:#8a8a8a;--sub2:#b3b3b3;--line:#ededed;--soft:#f7f7f7;
  --danger:#c0392b;
  --st-todo-bg:#f2f2f2;--st-todo-fg:#6b6b6b;
  --st-reading-bg:#e9f1fe;--st-reading-fg:#2f6fdc;
  --st-done-bg:#e8f6ee;--st-done-fg:#2e8b57;
  --st-dropped-bg:#fdecec;--st-dropped-fg:#c0392b;
  --st-reread-bg:#f1edfd;--st-reread-fg:#6c4bd4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#fff;color:var(--fg);font-size:15px;line-height:1.55;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--fg)}
h1,h2,h3{margin:0;font-weight:600}
.page{padding:0 16px 24px;max-width:640px;margin:0 auto}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:8px;height:56px;position:sticky;top:0;background:#fff;z-index:10}
.topbar h1{font-size:20px;letter-spacing:.3px;flex:1}
.topbar-title{font-size:16px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:var(--fg)}
.btn-icon:active{background:var(--soft)}
.btn-text{font-size:14px;color:var(--fg);padding:6px 4px}
.btn-mini{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--soft);color:#555;white-space:nowrap}
.btn-mini:disabled{opacity:.3}
.btn-mini.danger{color:var(--danger)}
.btn-ghost{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;background:#fff}
.btn-ghost.danger{color:var(--danger)}
.btn-primary{background:var(--fg);color:#fff;border-radius:12px;padding:10px 20px;font-size:14px;font-weight:500}
.btn-primary:disabled{opacity:.6}

/* 首页 */
.hero{padding:18px 0 16px}
.hero-date{font-size:12px;color:var(--sub);letter-spacing:.3px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.hero-hi{font-size:24px;font-weight:600;letter-spacing:.3px;display:inline-flex;align-items:center;gap:7px;text-align:left;max-width:100%}
.hero-hi:active{opacity:.55}
.hero-hi-edit{font-size:13px;color:var(--sub2);font-weight:400;line-height:1;flex-shrink:0}
.hero-meta{font-size:13px;color:var(--sub);margin-top:4px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qcard{border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;background:#fff}
.qcard:active{background:var(--soft)}
.qcard-l{font-size:14px;font-weight:500}
.qcard-s{font-size:11px;color:var(--sub);margin-top:2px}

/* 快捷添加书籍 */
.addbook{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  margin-top:10px;padding:12px;border:1px dashed #d9d9d9;border-radius:14px;
  font-size:14px;color:#555;background:#fff;letter-spacing:.2px;
}
.addbook:active{background:var(--soft);border-color:#c6c6c6}
.addbook .plus{font-size:16px;line-height:1;color:var(--sub);font-weight:400}

.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:10px}
.sec-h a{font-size:12px;color:var(--sub2)}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.stat:active{background:var(--soft)}
.stat-n{font-size:18px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-l{font-size:11px;color:var(--sub);margin-top:2px}

/* 列表行 */
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row-rate{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.row-ops{display:flex;gap:6px;flex-shrink:0}

/* 紧凑行（最新动态） */
.minirow{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left;background:none}
.minirow:last-child{border-bottom:0}
.minirow:active{opacity:.6}
.minirow-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:14px}
.minirow-d{font-size:12px;color:var(--sub2);flex-shrink:0;font-variant-numeric:tabular-nums;margin-left:2px}

/* 首页摘录 */
.hquote{padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hquote:last-child{border-bottom:0}
.hquote-head{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.hquote-title{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hquote-arrow{font-size:11px;color:var(--sub2);transition:transform .18s ease;flex-shrink:0;line-height:1}
.hquote-arrow.open{transform:rotate(180deg)}
.hquote-text{font-size:13.5px;line-height:1.72;color:#444;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hquote-text.open{-webkit-line-clamp:unset;overflow:visible}

/* 状态 */
.pill{display:inline-flex;align-items:center;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.st-todo{background:var(--st-todo-bg);color:var(--st-todo-fg)}
.st-reading{background:var(--st-reading-bg);color:var(--st-reading-fg)}
.st-done{background:var(--st-done-bg);color:var(--st-done-fg)}
.st-dropped{background:var(--st-dropped-bg);color:var(--st-dropped-fg)}
.st-reread{background:var(--st-reread-bg);color:var(--st-reread-fg)}

/* 详情页状态切换条 */
.status-bar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.status-btn{display:inline-flex;align-items:center;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:background .12s,color .12s}
.status-btn:active{opacity:.7}
.status-btn.off{background:#fff;color:#888;border:1px solid var(--line);font-weight:400}
.status-btn.on.st-todo{background:var(--st-todo-bg);color:var(--st-todo-fg)}
.status-btn.on.st-reading{background:var(--st-reading-bg);color:var(--st-reading-fg)}
.status-btn.on.st-done{background:var(--st-done-bg);color:var(--st-done-fg)}
.status-btn.on.st-dropped{background:var(--st-dropped-bg);color:var(--st-dropped-fg)}
.status-btn.on.st-reread{background:var(--st-reread-bg);color:var(--st-reread-fg)}

/* 标签 */
.tag{display:inline-flex;align-items:center;font-size:12px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);color:#555;background:#fff;line-height:1.4}
.tag.on{background:var(--fg);color:#fff;border-color:var(--fg)}

/* 搜索/筛选 */
.search{margin:4px 0 10px}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--soft);outline:none}
.search input:focus{background:#fff;border-color:#ddd}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:#555;background:#fff;white-space:nowrap}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}

/* 详情 */
.detail{padding-top:6px}
.d-title{font-size:24px;font-weight:600;line-height:1.35}
.d-orig{font-size:13px;color:var(--sub);margin-top:4px}
.d-row{display:flex;align-items:center;gap:10px;margin:14px 0 18px}
.d-meta{font-size:13px;color:var(--sub)}
.d-line{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.d-line .k{color:var(--sub);width:64px;flex-shrink:0;font-size:13px}
.d-block{padding:14px 0;border-top:1px solid var(--line)}
.d-block .k{color:var(--sub);font-size:13px;margin-bottom:8px}
.d-block .k-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.d-block .k-head>span{color:var(--sub);font-size:13px}
.d-review{font-size:14px;line-height:1.7;white-space:pre-wrap;color:#333}
.tagwrap{display:flex;flex-wrap:wrap;gap:6px}
.d-actions{display:flex;gap:10px;margin-top:22px}
.d-actions button{flex:1}

/* 摘录 */
.quote{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.quote-text{font-size:14px;line-height:1.75;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.quote-text.open{-webkit-line-clamp:unset;overflow:visible}
.quote-text-static{font-size:14px;line-height:1.75;white-space:pre-wrap}
.quote-thought{font-size:13px;color:#666;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);line-height:1.7;white-space:pre-wrap}
.quote-meta{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--sub)}
.qbook{font-size:12px;color:var(--fg);font-weight:500;background:var(--soft);padding:3px 9px;border-radius:8px}
.qedit{margin-left:auto;font-size:12px;color:var(--sub2)}
.qdel{font-size:12px;color:var(--sub2)}

/* 书籍选择器 */
.picker-results{margin-top:6px;max-height:220px;overflow-y:auto}
.picker-item{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff;font-size:14px}
.picker-item:active{background:var(--soft)}
.picker-sub{font-size:12px;color:var(--sub);margin-top:1px}
.picker-empty{font-size:12px;color:var(--sub2);padding:6px 2px}
.picked{font-size:13px;color:#555;margin-top:6px}
.field-static{padding:10px 12px;background:var(--soft);border-radius:11px;font-size:15px}

/* 书单 */
.listrow{display:flex;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}
.chev{color:var(--sub2);font-size:18px}
.listtools{display:flex;gap:10px;margin:6px 0 14px}
.listtools button{flex:1}

/* 标签管理 */
.tagline{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.tagline .tag{min-width:auto}
.tagcount{font-size:12px;color:var(--sub2);flex:1}

/* 空状态 */
.empty{text-align:center;color:var(--sub2);font-size:13px;padding:38px 0}

/* 底部导航 */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.96);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--sub2)}
.tab.on{color:var(--fg)}
.tab-ico{width:22px;height:22px;display:block}
.tab-ico svg{width:22px;height:22px;display:block}
.tab-lb{font-size:10px;letter-spacing:.2px}

/* 弹窗 */
#modalRoot .overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;display:flex;align-items:flex-end;justify-content:center;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease;
}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{font-size:17px;font-weight:600;margin-bottom:16px}
.field{display:block;margin-bottom:14px}
.field>span{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
.field>span i{color:var(--danger);font-style:normal}
.field>span b{font-weight:600;color:var(--fg);font-size:13px;font-variant-numeric:tabular-nums}
.field input[type=text],.field input:not([type]),.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--soft);outline:none;resize:vertical;
}
.field input:focus,.field select:focus,.field textarea:focus{background:#fff;border-color:#ddd}
.field input[type=range]{width:100%;margin:2px 0;-webkit-appearance:none;height:26px;background:transparent}
.field input[type=range]::-webkit-slider-runnable-track{height:4px;background:#eee;border-radius:2px}
.field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--fg);margin-top:-9px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{flex:1;min-width:60px;font-size:12.5px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);color:#555;background:#fff;white-space:nowrap}
.seg.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{flex:1;padding:12px}
.hint{font-size:12px;color:var(--sub);margin:0 0 10px}
.export-area{width:100%;height:160px;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:11px;background:var(--soft);font-family:ui-monospace,Menlo,monospace}

/* 设置 */
.setting-row{display:flex;align-items:center;width:100%;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px;text-align:left;background:none}
.setting-row.danger{color:var(--danger)}
.setting-row.plain{color:var(--sub);font-size:13px}

/* 需求清单弹窗 */
.req{font-size:13px;line-height:1.75;color:#333}
.req h3{font-size:13.5px;font-weight:600;margin:16px 0 6px;color:var(--fg)}
.req h3:first-child{margin-top:0}
.req ul{margin:0;padding-left:18px}
.req li{margin:2px 0}

/* 登录页 */
.auth-wrap{max-width:360px;margin:80px auto;padding:0 24px}
.auth-title{font-size:22px;font-weight:600;margin-bottom:24px;line-height:1.35}
.auth-input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-size:15px;background:var(--soft);outline:none}
.auth-input:focus{background:#fff;border-color:#ddd}
.auth-btn{width:100%;padding:14px;background:var(--fg);color:#fff;border-radius:10px;font-size:15px;font-weight:500}
.auth-btn:disabled{opacity:.6}
.auth-msg{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}
.auth-foot{font-size:12px;color:var(--sub2);margin-top:24px;text-align:center;line-height:1.7}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(17,17,17,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  z-index:999;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center;
}
#toast.show{opacity:1}

/* 备份项 */
.backup-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.backup-info{flex:1;min-width:0}
.backup-ts{font-size:14px;font-weight:500}
.backup-meta{font-size:12px;color:var(--sub);margin-top:2px}

/* 统计页 */
.stat-blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat-block{border:1px solid var(--line);border-radius:12px;padding:16px 8px;text-align:center}
.stat-block-n{font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-block-l{font-size:12px;color:var(--sub);margin-top:4px}

.dist-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.dist-label{width:52px;color:var(--sub);flex-shrink:0}
.dist-bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.dist-fill{height:100%;border-radius:4px;transition:width .3s}
.dist-fill.st-todo{background:var(--st-todo-fg)}
.dist-fill.st-reading{background:var(--st-reading-fg)}
.dist-fill.st-done{background:var(--st-done-fg)}
.dist-fill.st-dropped{background:var(--st-dropped-fg)}
.dist-fill.st-reread{background:var(--st-reread-fg)}
.dist-count{width:32px;text-align:right;font-variant-numeric:tabular-nums;color:#555}

.chart{display:flex;gap:4px;height:120px;align-items:flex-end;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}

function fmtDate(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function fmtDateTime(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtCnDate(d){
  const w = '日一二三四五六'[d.getDay()];

}

/* 深拷贝 / 相等判断（增量同步用） */
function cloneEntity(e){
  const o = {...e};
  if(Array.isArray(o.tags)) o.tags = [...o.tags];
  if(Array.isArray(o.bookIds)) o.bookIds = [...o.bookIds];
  return o;
}
function entityEqual(a, b){
  const ka = Object.keys(a), kb = Object.keys(b);
  if(ka.length !== kb.length) return false;
  for(const k of ka){
    const va = a[k], vb = b[k];
    if(Array.isArray(va) && Array.isArray(vb)){
      if(va.length !== vb.length) return false;
      for(let i=0;i<va.length;i++) if(va[i] !== vb[i]) return false;
    } else if(va !== vb){
      return false;
    }
  }
  return true;
}
function diffList(currentArr, prevMap){
  const curMap = new Map(currentArr.map(e => [e.id, e]));
  const upsert = [];
  const del = [];
  for(const e of currentArr){
    const prev = prevMap.get(e.id);
    if(!prev || !entityEqual(prev, e)) upsert.push(e);
  }
  for(const id of prevMap.keys()){
    if(!curMap.has(id)) del.push(id);
  }
  return { upsert, del };
}
function snapshotDB(d){
  return {
    books: new Map(d.books.map(b => [b.id, cloneEntity(b)])),
    tags: new Map(d.tags.map(t => [t.id, cloneEntity(t)])),
    lists: new Map(d.lists.map(l => [l.id, cloneEntity(l)])),
    quotes: new Map(d.quotes.map(q => [q.id, cloneEntity(q)])),
  };
}

function saveLocalBackup(){
  if(!db) return;
  try{
    let arr = [];
    try{ arr = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]'); }catch(e){ arr = []; }
    if(!Array.isArray(arr)) arr = [];
    arr.unshift({
      ts: Date.now(),
      title: db.settings.title || DEFAULT_TITLE,
      books: db.books,
      tags: db.tags,
      lists: db.lists,
      quotes: db.quotes,
    });
    arr = arr.slice(0, 3);
    localStorage.setItem(BACKUP_KEY, JSON.stringify(arr));
  }catch(e){ console.warn('本地备份失败：', e); }
}
function loadLocalBackups(){
  try{
    const arr = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]');
    return Array.isArray(arr) ? arr : [];

function bookToRow(b, uidv){
  return {
    id: b.id, user_id: uidv,
    title: b.title,
    original_title: b.originalTitle || '',
    author: b.author || '',
    characters: b.characters || '',
    region: b.region,
    type: b.type,
    status: b.status,
    rating: b.rating || 0,
    review: b.review || '',
    tags: b.tags || [],
    created_at: b.createdAt,
    updated_at: b.updatedAt,
    status_updated_at: b.statusUpdatedAt,
  };
}
function tagToRow(t, uidv){ return { id: t.id, user_id: uidv, name: t.name, builtin: !!t.builtin }; }
function listToRow(l, uidv){ return { id: l.id, user_id: uidv, name: l.name, book_ids: l.bookIds || [] }; }
function quoteToRow(q, uidv){ return { id: q.id, user_id: uidv, book_id: q.bookId, text: q.text, thought: q.thought || '', created_at: q.createdAt }; }

const Store = {
  async load(){
    const { data: { user }, error: ue } = await sb.auth.getUser();
    if(ue || !user){ db = null; lastSynced = null; return; }

    const [b, t, l, q] = await Promise.all([
      sb.from('books').select('*').eq('user_id', user.id),
      sb.from('tags').select('*').eq('user_id', user.id),
      sb.from('lists').select('*').eq('user_id', user.id),
      sb.from('quotes').select('*').eq('user_id', user.id),
    ]);

    const metaTitle = (user.user_metadata && user.user_metadata.bookshelf_title) || '';

    db = {
      version: 2,
      settings: { title: metaTitle || DEFAULT_TITLE },
      books: (b.data || []).map(row => ({
        id: row.id,
        title: row.title,
        originalTitle: row.original_title || '',
        author: row.author || '',
        characters: row.characters || '',
        region: row.region || '中国大陆',
        type: row.type || '原创',
        status: row.status || 'todo',
        rating: Number(row.rating) || 0,
        review: row.review || '',
        tags: row.tags || [],
        createdAt: Number(row.created_at) || Date.now(),
        updatedAt: Number(row.updated_at) || Date.now(),
        statusUpdatedAt: Number(row.status_updated_at) || Date.now(),
      })),
      tags: (t.data || []).map(row => ({ id: row.id, name: row.name, builtin: !!row.builtin })),
      lists: (l.data || []).map(row => ({ id: row.id, name: row.name, bookIds: row.book_ids || [] })),
      quotes: (q.data || []).map(row => ({
        id: row.id,
        bookId: row.book_id,
        text: row.text,
        thought: row.thought || '',
        createdAt: Number(row.created_at) || Date.now(),
      })),
    };

    lastSynced = snapshotDB(db);

    if(db.tags.length === 0){
      db.tags = DEFAULT_TAGS.map(n => ({ id: uid('t'), name: n, builtin: true }));
      try{ await Store.save(); }catch(e){}
    }
  },

  async save(){
    const { data: { user } } = await sb.auth.getUser();
    if(!user || !db) return;
    const uidv = user.id;
    try{
      if(!lastSynced){
        await this._fullSave(uidv);
      } else {
        await this._incrementalSave(uidv);
      }
      lastSynced = snapshotDB(db);
      saveLocalBackup();
    }catch(e){
      console.error('保存到云端失败：', e);
      showToast('保存失败：' + (e.message || '请检查网络后重试'));
      throw e;
    }
  },

  async _fullSave(uidv){
    await Promise.all([
      sb.from('books').delete().eq('user_id', uidv),
      sb.from('tags').delete().eq('user_id', uidv),
      sb.from('lists').delete().eq('user_id', uidv),
      sb.from('quotes').delete().eq('user_id', uidv),
    ]);
    const tasks = [];
    if(db.books.length)  tasks.push(sb.from('books').insert(db.books.map(b => bookToRow(b, uidv))));
    if(db.tags.length)   tasks.push(sb.from('tags').insert(db.tags.map(t => tagToRow(t, uidv))));
    if(db.lists.length)  tasks.push(sb.from('lists').insert(db.lists.map(l => listToRow(l, uidv))));
    if(db.quotes.length) tasks.push(sb.from('quotes').insert(db.quotes.map(q => quoteToRow(q, uidv))));
    const results = await Promise.all(tasks);
    const failed = results.find(r => r.error);
    if(failed) throw new Error(failed.error.message || '云端保存失败');
  },

  async _incrementalSave(uidv){
    const dBooks  = diffList(db.books,  lastSynced.books);
    const dTags   = diffList(db.tags,   lastSynced.tags);
    const dLists  = diffList(db.lists,  lastSynced.lists);
    const dQuotes = diffList(db.quotes, lastSynced.quotes);

    const delTasks = [];
    if(dBooks.del.length)  delTasks.push(sb.from('books').delete().eq('user_id', uidv).in('id', dBooks.del));
    if(dTags.del.length)   delTasks.push(sb.from('tags').delete().eq('user_id', uidv).in('id', dTags.del));
    if(dLists.del.length)  delTasks.push(sb.from('lists').delete().eq('user_id', uidv).in('id', dLists.del));
    if(dQuotes.del.length) delTasks.push(sb.from('quotes').delete().eq('user_id', uidv).in('id', dQuotes.del));
    if(delTasks.length){
      const res = await Promise.all(delTasks);
      const failed = res.find(r => r.error);
      if(failed) throw new Error(failed.error.message || '删除失败');
    }

    const ups = [];
    if(dBooks.upsert.length)  ups.push(sb.from('books').upsert(dBooks.upsert.map(b => bookToRow(b, uidv)), {onConflict:'id'}));
    if(dTags.upsert.length)   ups.push(sb.from('tags').upsert(dTags.upsert.map(t => tagToRow(t, uidv)), {onConflict:'id'}));
    if(dLists.upsert.length)  ups.push(sb.from('lists').upsert(dLists.upsert.map(l => listToRow(l, uidv)), {onConflict:'id'}));
    if(dQuotes.upsert.length) ups.push(sb.from('quotes').upsert(dQuotes.upsert.map(q => quoteToRow(q, uidv)), {onConflict:'id'}));
    if(ups.length){
      const res = await Promise.all(ups);
      const failed = res.find(r => r.error);
      if(failed) throw new Error(failed.error.message || '写入失败');
    }
  },

  async saveTitle(title){
    db.settings.title = title;
    try{
      const { error } = await sb.auth.updateUser({ data: { bookshelf_title: title } });
      if(error) throw error;
    }catch(e){
      console.error('保存标题失败', e);
      showToast('标题保存失败');
    }
  },

  async signOut(){
    await sb.auth.signOut();
    db = null;
    lastSynced = null;
  }
};

/* ============================================================
   4. 路由
   ============================================================ */
let route = {name:'home', params:{}};
let navStack = [];

function go(name, params={}){ navStack.push({name:route.name,params:route.params}); route={name,params}; render(); window.scrollTo(0,0); }
function back(){ route = navStack.pop() || {name:'home',params:{}}; render(); window.scrollTo(0,0); }
function switchTab(name){ navStack=[]; route={name,params:{}}; render(); window.scrollTo(0,0); }

let libSort = { byRating:false };
let quoteFilter = { q:'' };
let tagFilter = { q:'' };
let pickFilter = { q:'' };
let currentPickListId = null;
let expandedQuotes = new Set();
let expandedQuoteCards = new Set();

/* ============================================================
   5. 渲染入口
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(route.name){
    case 'home':       html = viewHome(); break;
    case 'library':    html = viewLibrary(); break;
    case 'book':       html = viewBook(route.params.id); break;
    case 'tags':       html = viewTags(); break;
    case 'quotes':     html = viewQuotes(); break;
    case 'bookquotes': html = viewBookQuotes(route.params.id); break;
    case 'lists':      html = viewLists(); break;
    case 'list':       html = viewList(route.params.id); break;
    case 'settings':   html = viewSettings(); break;
    case 'stats':      html = viewStats(); break;
    default:           html = viewHome();
  }
  app.innerHTML = html;
  renderTabbar();
}

function renderTabbar(){
  const cur = TAB_ROUTE[route.name] || 'home';
  document.getElementById('tabbar').innerHTML = TABS.map(t=>`
    <button class="tab ${cur===t.name?'on':''}" data-act="switchTab" data-tab="${t.name}">
      <span class="tab-ico">${ICONS[t.name]}</span>
      <span class="tab-lb">${t.label}</span>
    </button>`).join('');
}

/* ============================================================
   6. 通用片段
   ============================================================ */
function bookRow(b){
  const tags = (b.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  return `<div class="row" data-act="openBook" data-id="${b.id}">
    <div class="row-main">
      <div class="row-title">${esc(b.title)}</div>
      <div class="row-sub">${esc(b.author||'佚名')} · ${esc(b.region)} · ${esc(b.type)}</div>
      ${tags?`<div class="row-tags">${tags}</div>`:''}
    </div>
    <div class="row-right">
      ${statusPill(b.status)}
      ${b.rating>0?`<div class="row-rate">${b.rating.toFixed(1)}</div>`:''}
    </div>
  </div>`;
}

function quoteCard(q){
  const b = db.books.find(x=>x.id===q.bookId);
  const open = expandedQuoteCards.has(q.id);
  return `<div class="quote">
    <div class="quote-text ${open?'open':''}" data-act="toggleCardQuote" data-id="${q.id}">${esc(q.text)}</div>
    ${q.thought?`<div class="quote-thought">${esc(q.thought)}</div>`:''}
    <div class="quote-meta">
      <button class="qbook" data-act="openBook" data-id="${q.bookId}">${esc(b?b.title:'未知书籍')}</button>
      <span>${fmtDate(q.createdAt)}</span>
      <button class="qedit" data-act="editQuote" data-id="${q.id}">编辑</button>
      <button class="qdel" data-act="delQuote" data-id="${q.id}">删除</button>
    </div>
  </div>`;
}

function homeQuote(q){
  const b = db.books.find(x=>x.id===q.bookId);
  const open = expandedQuotes.has(q.id);
  return `<div class="hquote" data-act="toggleQuote" data-id="${q.id}">
    <div class="hquote-head">
      <div class="hquote-title">${esc(b?b.title:'未知书籍')}</div>
      <span class="hquote-arrow ${open?'open':''}">▾</span>
    </div>
    <div class="hquote-text ${open?'open':''}">${esc(q.text)}</div>
  </div>`;
}

/* ============================================================
   7. 视图：首页
   ============================================================ */
function viewHome(){
  const books = db.books;
  const counts = {}; STATUSES.forEach(s=>counts[s.key]=0);
  books.forEach(b=>{ if(counts[b.status]!=null) counts[b.status]++; });
  const rated = books.filter(b=>b.rating>0);
  const avg = rated.length ? (rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1) : '—';
  const reading = books.filter(b=>b.status==='reading').sort((a,b)=>b.updatedAt-a.updatedAt);
  const recentActivity  = books.slice()
    .filter(b=>b.statusUpdatedAt)
    .sort((a,b)=>b.statusUpdatedAt-a.statusUpdatedAt)
    .slice(0,3);
  const recentQuotes = db.quotes.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,3);
  const title = (db.settings && db.settings.title) || DEFAULT_TITLE;

  return `<div class="page">
    <header class="hero">
      <div class="hero-date">${fmtCnDate(new Date())}</div>
      <button class="hero-hi" data-act="renameHomeTitle">${esc(title)}<span class="hero-hi-edit">✎</span></button>
      <div class="hero-meta">共 ${books.length} 本 · 已读 ${counts.done} 本 · 均分 ${avg}</div>
    </header>

    <div class="quick">
      <button class="qcard" data-act="switchTab" data-tab="library"><div class="qcard-l">书库</div><div class="qcard-s">${books.length} 本</div></button>
      <button class="qcard" data-act="switchTab" data-tab="quotes"><div class="qcard-l">摘录</div><div class="qcard-s">${db.quotes.length} 条</div></button>
      <button class="qcard" data-act="switchTab" data-tab="lists"><div class="qcard-l">书单</div><div class="qcard-s">${db.lists.length} 个</div></button>
      <button class="qcard" data-act="go" data-to="tags"><div class="qcard-l">标签</div><div class="qcard-s">${db.tags.length} 个</div></button>
    </div>

    <button class="addbook" data-act="newBook"><span class="plus">＋</span> 添加书籍</button>

    <section class="sec">
      <div class="sec-h"><span>阅读状态</span></div>
      <div class="statgrid">
        ${STATUSES.map(s=>`<div class="stat" data-act="filterStatus" data-status="${s.key}">
          <div class="stat-n">${counts[s.key]}</div>
          <div class="stat-l">${s.label}</div>
        </div>`).join('')}
      </div>
    </section>

    ${reading.length?`<section class="sec">
      <div class="sec-h"><span>正在读</span><a data-act="filterStatus" data-status="reading">全部</a></div>
      ${reading.slice(0,3).map(bookRow).join('')}
    </section>`:''}

    <section class="sec">
      <div class="sec-h"><span>最新动态</span><a data-act="switchTab" data-tab="library">书库</a></div>
      ${recentActivity.length
        ? recentActivity.map(b=>`<button class="minirow" data-act="openBook" data-id="${b.id}">
            <span class="minirow-t">${esc(b.title)}</span>
            ${statusPill(b.status)}
            <span class="minirow-d">${fmtDate(b.statusUpdatedAt)}</span>
          </button>`).join('')
        : '<div class="empty">还没有阅读记录</div>'}
    </section>

    <section class="sec">
      <div class="sec-h"><span>最近摘录</span><a data-act="switchTab" data-tab="quotes">全部</a></div>
      ${recentQuotes.length
        ? recentQuotes.map(homeQuote).join('')
        : '<div class="empty">还没有摘录</div>'}
    </section>
  </div>`;
}

function bookListHTML(){
  let arr = db.books.slice();
  if(libFilter.status!=='all') arr = arr.filter(b=>b.status===libFilter.status);
  if(libFilter.tag) arr = arr.filter(b=>(b.tags||[]).includes(libFilter.tag));
  const q = libFilter.q.trim().toLowerCase();
  if(q){
    arr = arr.filter(b=>{
      const hay = [
        b.title, b.originalTitle || '', b.author || '',
        b.region || '', b.type || '',
        ...(b.tags||[])
      ].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  if(libSort.byRating){
    arr.sort((a,b)=>{
      const ra = Number(a.rating) || 0;
      const rb = Number(b.rating) || 0;
      if(rb !== ra) return rb - ra;
      return String(a.title||'').localeCompare(String(b.title||''), 'zh');
    });
  } else {
    arr.sort((a,b)=>b.updatedAt-a.updatedAt);
  }

  if(!arr.length) return `<div class="empty">没有找到书籍</div>`;
  return arr.map(bookRow).join('');
}

/* ============================================================
   13.5 视图：阅读统计
   ============================================================ */
function viewStats(){
  const year = new Date().getFullYear();
  const doneBooks = db.books.filter(b =>
    (b.status==='done' || b.status==='reread') &&
    new Date(b.statusUpdatedAt).getFullYear() === year
  );
  const rated = db.books.filter(b=>b.rating>0);
  const avg = rated.length ? (rated.reduce((a,b)=>a+b.rating,0)/rated.length) : 0;
  const counts = {}; STATUSES.forEach(s=>counts[s.key]=0);
  db.books.forEach(b=>{ if(counts[b.status]!=null) counts[b.status]++; });
  const total = db.books.length || 1;

  const monthly = new Array(12).fill(0);
  doneBooks.forEach(b=>{
    const m = new Date(b.statusUpdatedAt).getMonth();
    monthly[m]++;
  });
  const maxV = Math.max(...monthly, 1);
  const barH = monthly.map(n => Math.round(n / maxV * 90));

  return `<div class="page">
    <header class="topbar">
      <button class="btn-icon" data-act="back">‹</button>
      <h1 class="topbar-title">阅读统计</h1>
      <span style="width:34px"></span>
    </header>

    <div class="stat-blocks">
      <div class="stat-block">
        <div class="stat-block-n">${doneBooks.length}</div>
        <div class="stat-block-l">${year} 年读完</div>
      </div>
      <div class="stat-block">
        <div class="stat-block-n">${avg>0 ? avg.toFixed(1) : '—'}</div>
        <div class="stat-block-l">平均评分</div>
      </div>
      <div class="stat-block">
        <div class="stat-block-n">${db.books.length}</div>
        <div class="stat-block-l">藏书总数</div>
      </div>
    </div>

    <section class="sec">
      <div class="sec-h"><span>状态分布</span></div>
      ${STATUSES.map(s=>{
        const n = counts[s.key];
        const pct = total > 0 ? Math.round(n / total * 100) : 0;
        return `<div class="dist-row">
          <div class="dist-label">${s.label}</div>
          <div class="dist-bar"><div class="dist-fill st-${s.key}" style="width:${pct}%"></div></div>
          <div class="dist-count">${n}</div>
        </div>`;
      }).join('')}
    </section>

    <section class="sec">
      <div class="sec-h"><span>${year} 年阅读趋势</span></div>
      <div class="chart">
        ${monthly.map((n,i)=>`<div class="bar-wrap">
          <div class="bar" style="height:${barH[i]}px" title="${i+1}月：${n}本"></div>
          <div class="bar-label">${i+1}</div>
        </div>`).join('')}
      </div>
      <div class="chart-hint">每月读完的书本数</div>
    </section>
  </div>`;
}

function recentQuoteBooks(){
  const seen = new Set();
  const arr = [];
  const qs = db.quotes.slice().sort((a,b)=>b.createdAt-a.createdAt);
  for(const q of qs){
    if(seen.has(q.bookId)) continue;
    seen.add(q.bookId);
    const b = db.books.find(x=>x.id===q.bookId);
    if(b) arr.push(b);
    if(arr.length >= 5) break;   /* v0.11.0：最多 5 条 */
  }
  return arr;
}

function bookPickerItemsHTML(arr){
  return arr.map(b=>`<button type="button" class="picker-item" data-act="pickQuoteBook" data-id="${b.id}">
    <span>${esc(b.title)}</span>
    <span class="picker-sub">${esc(b.author||'佚名')} · ${esc(b.region)}</span>
  </button>`).join('');
}

function renderRecentBookPicker(){
  const box = document.getElementById('bookPickerResults');

  const arr = recentQuoteBooks();
  if(!arr.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="picker-empty">最近摘录过的书</div>' + bookPickerItemsHTML(arr);
}

function pickResultsHTML(listId){
  const l = db.lists.find(x=>x.id===listId);
  if(!l) return '';
  const q = pickFilter.q.trim().toLowerCase();
  let arr = db.books.filter(b=>!l.bookIds.includes(b.id));
  if(q){
    arr = arr.filter(b=>{
      const hay = [b.title, b.originalTitle||'', b.author||'', ...(b.tags||[])].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  arr.sort((a,b)=>b.updatedAt-a.updatedAt);
  if(!arr.length){
    return q
      ? '<div class="empty" style="padding:20px 0">没有匹配的书籍</div>'
      : '<div class="empty" style="padding:20px 0">所有书都已在这个书单里</div>';
  }
  return arr.map(b=>`<div class="row">
    <div class="row-main" data-act="addToList" data-list="${listId}" data-bid="${b.id}">
      <div class="row-title">${esc(b.title)}</div>
      <div class="row-sub">${esc(b.author||'佚名')} · ${esc(b.region)}</div>
      ${(b.tags||[]).length?`<div class="row-tags">${(b.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    </div>
    <button class="btn-mini" data-act="addToList" data-list="${listId}" data-bid="${b.id}">添加</button>
  </div>`).join('');
}

function openPickBooks(listId){

function openLocalBackupsModal(){
  const arr = loadLocalBackups();
  const rows = arr.length
    ? arr.map((b, i)=>{
        const ts = fmtDateTime(b.ts);
        const counts = `${(b.books||[]).length} 本 / ${(b.quotes||[]).length} 摘录 / ${(b.lists||[]).length} 书单`;
        return `<div class="backup-item">
          <div class="backup-info">
            <div class="backup-ts">${ts}${i===0?' · 最新':''}</div>
            <div class="backup-meta">${counts} · 标题「${esc(b.title||DEFAULT_TITLE)}」</div>
          </div>
          <button class="btn-mini" data-act="restoreBackup" data-ts="${b.ts}">恢复</button>
        </div>`;
      }).join('')
    : '<div class="empty" style="padding:24px 0">还没有本地备份</div>';

  openModal(`
    <div class="modal-h">本地备份与恢复</div>
    <p class="hint">每次保存成功后自动生成快照，最多保留 3 份。恢复会用备份覆盖云端数据，请谨慎操作。</p>
    ${rows}
    <div class="modal-actions">
      <button type="button" class="btn-ghost" data-act="closeModal">关闭</button>
    </div>
  `);
}

async function restoreBackup(ts){
  const arr = loadLocalBackups();
  const b = arr.find(x => x.ts === Number(ts));
  if(!b){ showToast('备份不存在'); return; }
  if(!confirm(`确定恢复到 ${fmtDateTime(b.ts)} 的备份？\n当前云端数据会被覆盖。`)) return;
  db = {
    version: 2,
    settings: { title: b.title || DEFAULT_TITLE },
    books: (b.books || []).map(x => ({ characters:'', ...x })),
    tags: b.tags || [],
    lists: b.lists || [],
    quotes: b.quotes || [],
  };
  lastSynced = null;
  try{
    await Store.save();
    if(b.title) await Store.saveTitle(b.title);
    closeModal();
    render();
    showToast('已恢复备份');
  }catch(e){}
}

/* ============================================================
   21. 事件委托
   ============================================================ */
document.addEventListener('click', async (e)=>{
  if(e.target.id==='modalOverlay'){ closeModal(); return; }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch(act){
    case 'switchTab': switchTab(el.dataset.tab); break;
    case 'go':
      if(el.dataset.to==='library'){ libFilter={q:'',status:'all',tag:null}; }
      switchTab(el.dataset.to); break;
    case 'back': back(); break;

    case 'closeModal': closeModal(); break;
    case 'showRequirements':
      openModal(`
        <div class="modal-h">需求清单</div>
        ${REQ_DOC}
        <div class="modal-actions">
          <button type="button" class="btn-ghost" data-act="closeModal">关闭</button>
        </div>
      `);
      break;
    case 'showLocalBackups': openLocalBackupsModal(); break;
    case 'restoreBackup': await restoreBackup(el.dataset.ts); break;
    case 'openStats': go('stats'); break;

    case 'logout': {
      if(!confirm('退出登录？')) break;
      await Store.signOut();
      location.reload();
      break;
    }

    case 'renameHomeTitle': {
      const cur = (db.settings && db.settings.title) || DEFAULT_TITLE;
      const name = (prompt('书斋名称', cur) || '').trim();
      if(!name || name===cur) break;
      await Store.saveTitle(name);
      render();
      break;
    }

    case 'toggleQuote': {
      const text = el.querySelector('.hquote-text');
      const arrow = el.querySelector('.hquote-arrow');
      if(!text) break;
      const isOpen = text.classList.toggle('open');
      if(arrow) arrow.classList.toggle('open', isOpen);
      if(isOpen) expandedQuotes.add(id); else expandedQuotes.delete(id);
      break;
    }

    case 'toggleCardQuote': {
      const isOpen = el.classList.toggle('open');
      if(isOpen) expandedQuoteCards.add(id); else expandedQuoteCards.delete(id);
      break;
    }

    case 'toggleRatingSort': {
      libSort.byRating = !libSort.byRating;
      render();
      break;
    }

    /* v0.11.0：详情页快速切换状态 */
    case 'quickStatus': {
      const bid = el.dataset.id;
      const newStatus = el.dataset.status;
      const b = db.books.find(x=>x.id===bid);
      if(!b || b.status === newStatus) break;
      const oldStatus = b.status;
      const oldStatusUpdatedAt = b.statusUpdatedAt;
      const oldUpdatedAt = b.updatedAt;
      b.status = newStatus;
      b.statusUpdatedAt = Date.now();
      b.updatedAt = Date.now();
      render();
      try{
        await Store.save();
      }catch(err){
        b.status = oldStatus;
        b.statusUpdatedAt = oldStatusUpdatedAt;
        b.updatedAt = oldUpdatedAt;
        render();
      }
      break;
    }

    case 'newBook': openBookForm(); break;
    case 'editBook': openBookForm(id); break;
    case 'openBook': go('book',{id}); break;
    case 'delBook': {
      const b = db.books.find(x=>x.id===id);
      if(!b) break;
      if(!confirm(`删除《${b.title}》？\n该书下的摘录也会一起删除。`)) break;
      db.books = db.books.filter(x=>x.id!==id);
      db.quotes = db.quotes.filter(q=>q.bookId!==id);
      db.lists.forEach(l=>{ l.bookIds = l.bookIds.filter(bid=>bid!==id); });
      try{ await Store.save(); back(); }catch(e){}
      break;
    }

    case 'filterStatus':
      libFilter = {q:'', status:el.dataset.status, tag:null};
      switchTab('library');
      break;
    case 'setStatusFilter':
      libFilter.status = el.dataset.status;
      render();
      break;
    case 'clearTagFilter':
      libFilter.tag = null;
      render();
      break;
    case 'tagToLibrary':
      libFilter = {q:'', status:'all', tag:el.dataset.name};
      switchTab('library');
      break;

    case 'formStatus': {
      const f = document.getElementById('bookForm');
      if(!f) break;
      f.elements['status'].value = el.dataset.status;
      f.querySelectorAll('.segs .seg').forEach(s=>{
        s.classList.toggle('on', s.dataset.status===el.dataset.status);
      });
      break;
    }
    case 'formTag': el.classList.toggle('on'); break;

    case 'formNewTag': {
      const name = (prompt('新标签名称')||'').trim();
      if(!name) break;
      const wrap = document.getElementById('formTags');
      if(!wrap) break;
      const existing = [...wrap.querySelectorAll('.tag')].find(x=>x.dataset.name===name);
      if(existing){ existing.classList.add('on'); break; }
      const hint = wrap.querySelector('span');
      if(hint) hint.remove();
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tag on';
      btn.dataset.act = 'formTag';
      btn.dataset.name = name;
      btn.textContent = name;
      wrap.appendChild(btn);
      break;
    }

    case 'addToLists': openListPicker(id); break;
    case 'toggleBookList': {
      const l = db.lists.find(x=>x.id===el.dataset.list);
      const bid = el.dataset.bid;
      if(!l) break;
      if(l.bookIds.includes(bid)) l.bookIds = l.bookIds.filter(x=>x!==bid);
      else l.bookIds.push(bid);
      try{ await Store.save(); render(); openListPicker(bid); }catch(e){}
      break;
    }
    case 'newListForBook': {
      const bid = el.dataset.bid;
      const name = (prompt('新书单名称')||'').trim();
      if(!name) break;
      const l = {id:uid('l'), name, bookIds:[bid]};
      db.lists.push(l);
      try{ await Store.save(); render(); openListPicker(bid); }catch(e){}
      break;
    }

    case 'newTag': {
      const name = (prompt('新标签名称')||'').trim();
      if(!name) break;
      if(db.tags.some(t=>t.name===name)){ alert('标签已存在'); break; }
      db.tags.push({id:uid('t'), name, builtin:false});
      try{ await Store.save(); render(); }catch(e){}
      break;
    }
    case 'renameTag': {
      const t = db.tags.find(x=>x.id===id);
      if(!t) break;
      const name = (prompt('新的标签名称', t.name)||'').trim();
      if(!name || name===t.name) break;
      if(db.tags.some(x=>x.name===name)){ alert('标签已存在'); break; }
      const old = t.name;
      t.name = name;
      db.books.forEach(b=>{ if(b.tags) b.tags = b.tags.map(n=>n===old?name:n); });
      try{ await Store.save(); render(); }catch(e){}
      break;
    }
    case 'delTag': {
      const t = db.tags.find(x=>x.id===id);
      if(!t) break;
      const n = db.books.filter(b=>(b.tags||[]).includes(t.name)).length;
      if(!confirm(`删除标签「${t.name}」？\n${n} 本书上的这个标签也会被移除。`)) break;
      db.tags = db.tags.filter(x=>x.id!==id);
      db.books.forEach(b=>{ if(b.tags) b.tags = b.tags.filter(n2=>n2!==t.name); });
      if(libFilter.tag===t.name) libFilter.tag = null;
      try{ await Store.save(); render(); }catch(e){}
      break;
    }

    case 'newQuote': openQuoteForm(); break;
    case 'newQuoteFor': openQuoteForm(id); break;
    case 'editQuote': openQuoteEditForm(id); break;
    case 'pickQuoteBook': {
      const b = db.books.find(x=>x.id===id);
      if(!b) break;
      const f = document.getElementById('quoteForm');
      if(!f) break;
      const inp = document.getElementById('bookPickerInput');
      const hid = f.elements['bookId'];
      const box = document.getElementById('bookPickerResults');
      const picked = document.getElementById('bookPicked');
      if(inp) inp.value = b.title;
      if(hid) hid.value = b.id;
      if(box) box.innerHTML = '';
      if(picked) picked.innerHTML = `已选择：<b>${esc(b.title)}</b>`;
      break;
    }
    case 'delQuote': {
      if(!confirm('删除这条摘录？')) break;
      db.quotes = db.quotes.filter(q=>q.id!==id);
      expandedQuotes.delete(id);
      expandedQuoteCards.delete(id);
      try{ await Store.save(); render(); }catch(e){}
      break;
    }

    case 'newList': {
      const name = (prompt('书单名称')||'').trim();
      if(!name) break;
      db.lists.push({id:uid('l'), name, bookIds:[]});
      try{ await Store.save(); render(); }catch(e){}
      break;
    }
    case 'openList': go('list',{id}); break;
    case 'renameList': {
      const l = db.lists.find(x=>x.id===id);
      if(!l) break;
      const name = (prompt('新的书单名称', l.name)||'').trim();
      if(!name) break;
      l.name = name;
      try{ await Store.save(); render(); }catch(e){}
      break;
    }
    case 'delList': {
      const l = db.lists.find(x=>x.id===id);
      if(!l) break;
      if(!confirm(`删除书单「${l.name}」？\n书籍本身不会被删除。`)) break;
      db.lists = db.lists.filter(x=>x.id!==id);
      try{ await Store.save(); back(); }catch(e){}
      break;
    }
    case 'pickBooks': openPickBooks(id); break;
    case 'addToList': {
      const listId = el.dataset.list;
      const bid = el.dataset.bid;
      const l = db.lists.find(x=>x.id===listId);
      if(l && !l.bookIds.includes(bid)) l.bookIds.push(bid);
      try{
        await Store.save();
        render();
        const box = document.getElementById('pickResults');
        if(box) box.innerHTML = pickResultsHTML(listId);
      }catch(e){}
      break;
    }
    case 'removeFromList': {
      const l = db.lists.find(x=>x.id===el.dataset.list);
      if(!l) break;
      l.bookIds = l.bookIds.filter(b=>b!==el.dataset.bid);
      try{ await Store.save(); render(); }catch(e){}
      break;
    }
    case 'moveBookUp': {
      const l = db.lists.find(x=>x.id===el.dataset.list);
      if(!l) break;
      const i = l.bookIds.indexOf(el.dataset.bid);
      if(i>0){ [l.bookIds[i-1],l.bookIds[i]] = [l.bookIds[i],l.bookIds[i-1]]; try{ await Store.save(); render(); }catch(e){} }
      break;
    }
    case 'moveBookDown': {
      const l = db.lists.find(x=>x.id===el.dataset.list);
      if(!l) break;
      const i = l.bookIds.indexOf(el.dataset.bid);
      if(i>-1 && i<l.bookIds.length-1){ [l.bookIds[i+1],l.bookIds[i]] = [l.bookIds[i],l.bookIds[i+1]]; try{ await Store.save(); render(); }catch(e){} }
      break;
    }

    case 'exportData': {
      const data = JSON.stringify(db, null, 2);
      openModal(`
        <div class="modal-h">导出备份</div>
        <p class="hint">复制下方内容保存，或点下载保存为文件。</p>
        <textarea class="export-area" readonly id="exportArea">${esc(data)}</textarea>
        <div class="modal-actions">
          <button class="btn-ghost" data-act="closeModal">关闭</button>
          <button class="btn-primary" data-act="copyExport">复制</button>
          <button class="btn-primary" data-act="downloadExport">下载</button>
        </div>
      `);
      break;
    }
    case 'copyExport': {
      const ta = document.getElementById('exportArea');
      ta.select();
      try{ await navigator.clipboard.writeText(ta.value); alert('已复制到剪贴板'); }
      catch(err){ document.execCommand('copy'); alert('已复制'); }
      break;
    }
    case 'downloadExport': {
      const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `书斋备份_${fmtDate(Date.now())}.json`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      break;
    }
    case 'importData': {
      document.getElementById('importFile').click();
      break;
    }
    case 'clearAll': {
      if(!confirm('确定清空所有数据？\n此操作不可撤销，建议先导出备份。')) break;
      if(!confirm('再次确认：所有书籍、摘录、书单都会被删除。')) break;
      db = seedDB();
      lastSynced = null;
      try{ await Store.save(); render(); showToast('已清空'); }catch(e){}
      break;
    }
  }
});

/* --- 输入事件（200ms 防抖） --- */
document.addEventListener('input', (e)=>{
  const tid = e.target.id;

  if(tid==='libSearch'){
    libFilter.q = e.target.value;
    debouncedInput('lib', ()=>{
      const wrap = document.getElementById('bookList');
      if(wrap) wrap.innerHTML = bookListHTML();
    });
    return;
  }
  if(tid==='tagSearch'){
    tagFilter.q = e.target.value;
    debouncedInput('tag', ()=>{
      const wrap = document.getElementById('tagList');
      if(wrap) wrap.innerHTML = tagListHTML();
    });
    return;
  }
  if(tid==='quoteSearch'){
    quoteFilter.q = e.target.value;
    debouncedInput('quote', ()=>{
      const wrap = document.getElementById('quoteList');
      if(wrap) wrap.innerHTML = quoteListHTML();
    });
    return;
  }
  if(tid==='pickSearch'){
    pickFilter.q = e.target.value;
    debouncedInput('pick', ()=>{
      const box = document.getElementById('pickResults');
      const listId = currentPickListId || (box && box.dataset.listId);
      if(box && listId) box.innerHTML = pickResultsHTML(listId);
    });
    return;
  }
  if(tid==='bookPickerInput'){
    debouncedInput('picker', ()=>{
      const box = document.getElementById('bookPickerResults');
      if(!box) return;
      const inp = document.getElementById('bookPickerInput');
      const kw = inp ? inp.value.trim().toLowerCase() : '';
      if(!kw){ renderRecentBookPicker(); return; }
      const arr = db.books.filter(b=>b.title.toLowerCase().includes(kw)).slice(0,8);
      box.innerHTML = arr.length
        ? bookPickerItemsHTML(arr)
        : '<div class="picker-empty">没有匹配的书籍</div>';
    });
    return;
  }
  if(tid==='ratingRange'){
    const v = parseFloat(e.target.value)||0;
    const out = document.getElementById('ratingOut');
    if(out) out.textContent = v>0 ? v.toFixed(1) : '未评分';
  }
});

/* 聚焦摘录搜索框时展示最近摘录过的书 */
document.addEventListener('focusin', (e)=>{
  if(e.target.id === 'bookPickerInput' && !e.target.value.trim()){
    renderRecentBookPicker();
  }
});

/* --- 表单提交（含防重复提交） --- */
document.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const f = e.target;

  if(f.id==='bookForm'){
    if(f.dataset.submitting === '1') return;
    const g = n => f.elements[n] ? f.elements[n].value : '';
    const data = {
      title: g('title').trim(),
      originalTitle: g('originalTitle').trim(),
      author: g('author').trim(),
      characters: g('characters').trim(),
      region: g('region'),
      type: g('type'),
      status: g('status') || 'todo',
      rating: parseFloat(g('rating'))||0,
      review: g('review').trim(),
      tags: [...f.querySelectorAll('#formTags .tag.on')].map(el=>el.dataset.name),
    };
    if(!data.title){ alert('请填写书名'); return; }

    for(const tagName of data.tags){
      if(!db.tags.some(t=>t.name===tagName)){
        db.tags.push({id:uid('t'), name:tagName, builtin:false});
      }
    }

    f.dataset.submitting = '1';
    const submitBtn = f.querySelector('button[type=submit]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '保存中…'; }

    try{
      const id = f.dataset.id;
      if(id){
        const b = db.books.find(x=>x.id===id);
        if(b){
          const statusChanged = b.status !== data.status;
          Object.assign(b, data, {updatedAt:Date.now()});
          if(statusChanged) b.statusUpdatedAt = Date.now();
        }
      } else {
        const now = Date.now();
        db.books.push(Object.assign({id:uid('b'), createdAt:now, updatedAt:now, statusUpdatedAt:now}, data));
      }
      await Store.save();
      closeModal();
      render();
    }catch(err){
      f.dataset.submitting = '0';
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '保存'; }
    }
    return;
  }

  if(f.id==='quoteForm'){
    if(f.dataset.submitting === '1') return;
    const fixedBook = f.dataset.book;
    const bookId = fixedBook || (f.elements['bookId'] ? f.elements['bookId'].value : '');
    const text = f.elements['text'].value.trim();
    const thought = f.elements['thought'].value.trim();
    if(!text){ alert('请填写摘录内容'); return; }
    if(!bookId){ alert('请先搜索并选择书籍'); return; }

    f.dataset.submitting = '1';
    const submitBtn = f.querySelector('button[type=submit]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '保存中…'; }

    try{
      db.quotes.push({id:uid('q'), bookId, text, thought, createdAt:Date.now()});
      await Store.save();
      closeModal();
      render();
    }catch(err){
      f.dataset.submitting = '0';
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '保存'; }
    }
    return;
  }

  if(f.id==='quoteEditForm'){
    if(f.dataset.submitting === '1') return;
    const q = db.quotes.find(x=>x.id===f.dataset.id);
    if(!q) return;
    const text = f.elements['text'].value.trim();
    const thought = f.elements['thought'].value.trim();
    if(!text){ alert('摘录内容不能为空'); return; }

    f.dataset.submitting = '1';
    const submitBtn = f.querySelector('button[type=submit]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '保存中…'; }

    try{
      q.text = text;
      q.thought = thought;
      await Store.save();
      closeModal();
      render();
    }catch(err){
      f.dataset.submitting = '0';
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '保存'; }
    }
    return;
  }
});

/* --- 文件导入 --- */
document.addEventListener('change', (e)=>{
  if(e.target.id!=='importFile') return;
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const obj = JSON.parse(reader.result);
      if(!obj || !Array.isArray(obj.books)) throw new Error('bad');
      if(!confirm('导入会覆盖当前所有数据，确定继续？')) return;
      db = Object.assign(seedDB(), obj);
      if(!db.settings || typeof db.settings!=='object') db.settings = { title: DEFAULT_TITLE };
      if(!db.settings.title) db.settings.title = DEFAULT_TITLE;
      db.books.forEach(b=>{
        if(!b.statusUpdatedAt) b.statusUpdatedAt = b.updatedAt || b.createdAt || Date.now();
        if(b.characters == null) b.characters = '';
      });
      lastSynced = null;
      await Store.save();
      render();
      showToast('导入成功');
    }catch(err){
      alert('导入失败：' + (err.message || '文件格式不正确'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================================================
   22. 启动
   ============================================================ */
async function init() {
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    document.getElementById('app').innerHTML = `
      <div class="auth-wrap">
        <div class="auth-title">Read and Record BL</div>
        <input id="authEmail" class="auth-input" type="email" placeholder="邮箱" autocomplete="username">
        <input id="authPass" class="auth-input" type="password" placeholder="密码" autocomplete="current-password">
        <button id="authBtn" class="auth-btn">登录</button>
        <div id="authMsg" class="auth-msg"></div>
        <div class="auth-foot">账号由管理员在后台创建<br>忘记密码请联系管理员重置</div>
      </div>`;

    document.getElementById('authBtn').onclick = async () => {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value;
      const msg = document.getElementById('authMsg');
      msg.textContent = '';
      if(!email || !password){ msg.textContent = '请填写邮箱和密码'; return; }

      const btn = document.getElementById('authBtn');
      btn.disabled = true;
      btn.textContent = '登录中…';

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = '登录失败：' + error.message;
        btn.disabled = false;
        btn.textContent = '登录';
        return;
      }
      await Store.load();
      render();
      renderTabbar();
    };
    return;
  }

  await Store.load();
  render();
}

init();
</script>
